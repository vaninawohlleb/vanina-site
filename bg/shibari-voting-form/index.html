<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гласувай | Ванина Цонева</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,400;1,600;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/style.css">
</head>
<body class="page-form">

    <div class="card">

        <!-- VOTE FORM -->
        <form id="vote-form" novalidate>
            <h1 class="title" id="question">Какво искаш да научиш от шибари?</h1>
            <p class="subtitle" id="subtitle">Избери една опция. Гласуването отнема по-малко от минута.</p>

            <fieldset class="options" id="options"></fieldset>

            <!-- Honeypot against bots -->
            <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

            <label class="field-label" for="contact">Имейл (по желание)</label>
            <input class="field" type="email" id="contact" name="contact" placeholder="твоят@имейл.com">

            <button type="submit" class="btn-primary" id="submit-btn">Гласувам</button>
            <p class="message" id="message" role="alert"></p>
        </form>

        <!-- THANK YOU -->
        <div class="thanks" id="thanks">
            <h2 class="title">Благодаря за гласа!</h2>
            <p class="subtitle" style="margin-bottom:0;">Гласът ти е записан.</p>
        </div>

    </div>

    <script>
        /* ----------------------------------------------------------
           CONFIG: change these three things
        ---------------------------------------------------------- */
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwBulzTNIlELwTWcawfI3rvFSPqmH1br-WmESPRRqYcLNBpzrQZocTSScei_uDnUs7u/exec';
        const QUESTION   = 'Какво искаш да научиш от шибари?';
        const OPTIONS    = [
            'Динамика, свързване и flow в една сесия',
            'Специфични харнеси и връзвания',
            'Импровизация и създаване на връзвания на момента'
        ];
        /* ---------------------------------------------------------- */

        const form = document.getElementById('vote-form');
        const optionsEl = document.getElementById('options');
        const messageEl = document.getElementById('message');
        const submitBtn = document.getElementById('submit-btn');
        const thanksEl = document.getElementById('thanks');
        const STORAGE_KEY = 'voted:' + QUESTION;

        document.getElementById('question').textContent = QUESTION;

        OPTIONS.forEach(function (text, i) {
            const label = document.createElement('label');
            label.className = 'option';
            const input = document.createElement('input');
            input.type = 'radio';
            input.name = 'option';
            input.value = text;
            input.id = 'opt' + i;
            const span = document.createElement('span');
            span.textContent = text;
            label.appendChild(input);
            label.appendChild(span);
            optionsEl.appendChild(label);
        });

        function showThanks() {
            form.style.display = 'none';
            thanksEl.style.display = 'block';
        }

        try {
            if (localStorage.getItem(STORAGE_KEY)) { showThanks(); }
        } catch (e) { /* storage unavailable, ignore */ }

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            messageEl.textContent = '';

            const chosen = form.querySelector('input[name="option"]:checked');
            if (!chosen) {
                messageEl.textContent = 'Моля, избери една опция.';
                return;
            }
            if (form.website.value) { return; } // bot

            submitBtn.disabled = true;
            submitBtn.textContent = 'Изпращам...';

            const body = new URLSearchParams();
            body.append('option', chosen.value);
            body.append('contact', form.contact.value.trim());

            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: body })
                .then(function () {
                    try { localStorage.setItem(STORAGE_KEY, '1'); } catch (e) {}
                    showThanks();
                })
                .catch(function () {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Гласувам';
                    messageEl.textContent = 'Нещо се обърка. Опитай отново.';
                });
        });
    </script>
</body>
</html>
